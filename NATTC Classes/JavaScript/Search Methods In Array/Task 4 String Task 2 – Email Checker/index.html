<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let email = prompt("Enter Your Email...");

      let newem = email.toLowerCase();

      if (newem.includes("@") && newem.endsWith(".com")) {
        console.log("Valid Email");
      } else {
        console.log("Invalid Email");
      }

      console.log(`Total email length : ${newem.length}`);
    </script>
  </body>
</html>
