<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .container {
        width: 420px;
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      .input-box {
        display: flex;
        gap: 10px;
      }

      input {
        flex: 1;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
      }

      button {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #5563c1;
      }

      ul {
        margin-top: 20px;
        padding-left: 0;
      }

      li {
        list-style: none;
        background: #f5f5f5;
        padding: 12px;
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        animation: show 0.3s;
      }

      @keyframes show {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .deleteBtn {
        background: #ff4d4d;
        padding: 6px 12px;
        font-size: 14px;
        border-radius: 6px;
      }

      .deleteBtn:hover {
        background: #d90000;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>My Task Manager</h1>
      <div class="input-box">
        <input type="text" id="username" placeholder="Enter your task..." />
        <button onclick="addTask()">Add Task</button>
      </div>
      <ul id="Tasked"></ul>
    </div>

    <script>
      function addTask() {
        let add1 = document.getElementById("username").value;

        // Agar input khali ho toh task add na ho
        if (add1 === "") {
          alert("Kuch Enter kare");
        }

        let newList = document.createElement("li");
        newList.innerText = add1;

        let newTask = document.getElementById("Tasked");
        newTask.append(newList);

        let btn = document.createElement("button");
        btn.innerText = "Delete";
        btn.className = "deleteBtn";
        newList.append(btn);

        btn.onclick = function () {
          newList.remove();
        };

        document.getElementById("username").value = "";
      }
    </script>
  </body>
</html>
